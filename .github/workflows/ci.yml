name: CI

on:
  push:
  pull_request:

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++ gcc clang-format clang-tidy doxygen
      - name: Build
        run: ./scripts/build.sh ci-gcc
      - name: Test
        run: ./scripts/test.sh ci-gcc

  linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake clang clang++ clang-format clang-tidy doxygen
      - name: Build
        run: ./scripts/build.sh ci-clang
      - name: Test
        run: ./scripts/test.sh ci-clang
      - name: Format check
        run: ./scripts/format.sh ci-clang --check
      - name: Tidy
        run: ./scripts/tidy.sh ci-clang

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup MSVC dev shell
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Preset ci-msvc
      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1 -Preset ci-msvc

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install docs toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake doxygen clang-format
      - name: Generate docs
        run: ./scripts/generate_docs.sh
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: scaffold-docs
          path: docs/
